name: 构建 Windows 安装包

# 触发方式：手动点击 或 推送 tag(如 v1.0.0)
on:
  workflow_dispatch: # 允许在 Actions 页面手动点按钮触发
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成应用图标(若无则用占位图)
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "未找到图标，生成占位图标..."
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 1024,1024
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(99,102,241))
            $bmp.Save("app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            pnpm tauri icon app-icon.png
          } else {
            Write-Host "已有图标，跳过生成"
          }

      - name: 编译打包 Windows 安装包
        run: pnpm tauri build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: 视频交付下载器-Windows安装包
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn