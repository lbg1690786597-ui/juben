name: 构建 Windows 安装包

# 触发方式：手动点击 或 推送 tag(如 v1.0.0)
on:
  workflow_dispatch: # 允许在 Actions 页面手动点按钮触发
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成应用图标(若无则用占位图)
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "未找到图标，生成占位图标..."
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 1024,1024
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(99,102,241))
            $bmp.Save("app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            pnpm tauri icon app-icon.png
          } else {
            Write-Host "已有图标，跳过生成"
          }

      - name: 编译打包 Windows 安装包（含更新签名）
        run: pnpm tauri build
        env:
          # 更新签名私钥（本密钥无密码，故不传 PASSWORD 变量）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: 视频交付下载器-Windows安装包
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn

      # ===== 仅在推送 tag 时发布 Release + 生成 latest.json =====
      - name: 生成 latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$nsisDir/*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) {
            Write-Error "未找到 NSIS 安装包或签名文件，无法生成 latest.json"
            exit 1
          }
          $sigContent = Get-Content $sig.FullName -Raw
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = [ordered]@{
            version = $version
            notes   = "视频交付下载器 $version 更新"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent.Trim()
                url       = $downloadUrl
              }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Out-File -FilePath "latest.json" -Encoding utf8
          Write-Host "已生成 latest.json:"
          Get-Content latest.json

      - name: 发布 Release（附带安装包 + latest.json）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 视频交付下载器 ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
